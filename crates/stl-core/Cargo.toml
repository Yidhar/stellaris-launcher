[package]
name = "stl-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging",
    "Win32_System_ProcessStatus", "Win32_Security", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Com", "Win32_Networking_WinHttp", "Win32_System_Time", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_SystemInformation",
] }
