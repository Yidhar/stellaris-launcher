# dl-cn.stellarismod.com: the launcher's mirror for mainland China, on the Hong Kong (CN2) server. Goes in /etc/nginx/conf.d/, with
# stl-mirror.locations in /etc/nginx/snippets/. See README.md beside this file.

proxy_cache_path /var/cache/nginx/stl-mirror levels=1:2 keys_zone=stl_mirror:20m max_size=10g inactive=400d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=stl_mirror_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=stl_mirror_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name dl-cn.stellarismod.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # the old way of turning on HTTP/2: Debian 12 (1.22) and Ubuntu 24.04 (1.24) do not know `http2 on;` (1.25.1+ only warn about this)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dl-cn.stellarismod.com;

    ssl_certificate /etc/letsencrypt/live/dl-cn.stellarismod.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dl-cn.stellarismod.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:stl_mirror_tls:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/dl-cn.access.log;
    error_log /var/log/nginx/dl-cn.error.log warn;

    include /etc/nginx/snippets/stl-mirror.locations;
}
